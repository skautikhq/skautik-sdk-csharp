name: Publish

# Generated. Edit this in skautikhq/skautik-sdk, not here.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build everything, publish nothing
                type: boolean
                default: true

env:
    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            # Trusted publishing: nuget.org trades this for a key that lasts an
            # hour, so there is no stored key to leak or rotate.
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - run: dotnet pack --nologo --configuration Release --output artefacts

            # Requested immediately before the push: the key lasts an hour.
            - name: Exchange the OIDC token for a short-lived key
              if: env.DRY_RUN != 'true'
              id: login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Publish
              if: env.DRY_RUN != 'true'
              run: |
                  dotnet nuget push "artefacts/*.nupkg" \
                      --source https://api.nuget.org/v3/index.json \
                      --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                      --skip-duplicate
